<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#416F91">
  <meta name="description" content="Kalkulator Nilai Ujian Hifzh untuk ujian bulanan dan semester.">
  <title>Kalkulator Nilai Ujian Hifzh</title>

  <style>
    @font-face {
      font-family: "SF Arabic";
      src: url("./SFArabic-Regular(opsz28).ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --blue: #6B9FC4;
      --blue-dark: #416F91;
      --blue-deep: #345D79;
      --blue-soft: #EAF4FA;
      --blue-border: #D3E5EF;
      --bg: #F4F9FC;
      --text: #34434E;
      --muted: #7A8993;
      --border: #D9E6ED;
      --white: #FFFFFF;

      --error: #A86F69;
      --error-bg: #FFF7F6;
      --error-border: #E8C8C4;

      --shadow: 0 10px 32px rgba(65, 111, 145, .09);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    html, body {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: "SF Arabic", sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

/* Dekorasi Mega Mendung dari SVG */
body::before,
body::after {
  content: "";
  position: fixed;
  z-index: 0;
  pointer-events: none;

  width: 270px;
  height: 225px;

  background-image: url("./q87mF01.svg");
  background-repeat: no-repeat;
  background-size: 155%;
  
  opacity: 0.10;

  filter:
    saturate(55%)
    brightness(1.08)
    contrast(85%);
}

/* Pojok kanan atas */
body::before {
  top: -55px;
  right: -75px;

  background-position: 70% 25%;

  -webkit-mask-image:
    radial-gradient(
      ellipse at 100% 0%,
      black 0%,
      rgba(0,0,0,.92) 28%,
      rgba(0,0,0,.55) 52%,
      transparent 82%
    );
  mask-image:
    radial-gradient(
      ellipse at 100% 0%,
      black 0%,
      rgba(0,0,0,.92) 28%,
      rgba(0,0,0,.55) 52%,
      transparent 82%
    );
}

body::after {
  left: -55px;
  bottom: -75px;

  background-position: 25% 75%;

  transform: none;

  -webkit-mask-image:
    radial-gradient(
      ellipse at 0% 100%,
      black 0%,
      rgba(0,0,0,.90) 22%,
      rgba(0,0,0,.45) 48%,
      transparent 78%
    );

  mask-image:
    radial-gradient(
      ellipse at 0% 100%,
      black 0%,
      rgba(0,0,0,.90) 22%,
      rgba(0,0,0,.45) 48%,
      transparent 78%
    );
}

/* Konten tetap di atas ornamen */
.container,
.footer {
  position: relative;
  z-index: 1;
}

    button, input, select { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .container {
      width: min(100%, 720px);
      margin: 0 auto;
      padding: 28px 25px 40px;
      box-sizing: border-box;
      flex: 1 0 auto;
    }

    .app-card {
      background: transparent;
      border: 0;
      border-radius: 0;
      padding: 0;
      box-shadow: none;
    }

    .header {
      text-align: center;
      margin-bottom: 27px;
    }

    h1 {
      margin: 0;
      color: var(--blue-deep);
      font-size: clamp(24px, 5vw, 29px);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -.4px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
    }

    .field { margin-top: 17px; }
    .field:first-child { margin-top: 0; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #3E4F5B;
      font-size: 14px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      min-height: 47px;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #FBFDFF;
      color: var(--text);
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease, background .2s ease;
    }

    input::placeholder { color: #A2AFB8; }

    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(107, 159, 196, .14);
    }

    .clear-name-wrap { position: relative; }
    .clear-name-wrap input { padding-right: 42px; }

    .clear-name {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      width: 29px;
      height: 29px;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #93A2AC;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      box-shadow: none;
    }

    .clear-name:hover {
      background: var(--blue-soft);
      color: var(--blue-dark);
    }

    .form-area { margin-top: 21px; }
    .dynamic-form { animation: formIn .25s ease; }

    @keyframes formIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .note {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .hidden { display: none !important; }

    .calculate-button {
      width: 100%;
      min-height: 49px;
      margin-top: 24px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(65, 111, 145, .18);
      transition: background .18s ease, transform .15s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .calculate-button:disabled {
      cursor: default;
      opacity: .45;
      box-shadow: none;
    }

    .calculate-button:hover:not(:disabled) {
      background: var(--blue-dark);
      box-shadow: 0 8px 18px rgba(65, 111, 145, .23);
    }

    .calculate-button:active:not(:disabled) {
      transform: translateY(1px);
    }

    .input-error {
      border-color: var(--error-border) !important;
      background: var(--error-bg) !important;
      box-shadow: 0 0 0 3px rgba(232, 200, 196, .12) !important;
    }

    .error-message {
      margin-top: 6px;
      color: var(--error);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 500;
    }

    .result {
      margin-top: 28px;
      padding: 18px;
      border: 1px solid var(--blue-border);
      border-radius: 15px;
      background: var(--blue-soft);
      animation: resultIn .3s ease;
    }

    @keyframes resultIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      margin: 0 0 14px;
      color: var(--blue-dark);
      font-size: 17px;
      font-weight: 700;
    }

    .result-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .result-item {
      min-width: 0;
      padding: 15px;
      border: 1px solid #D9E8F0;
      border-radius: 12px;
      background: #fff;
    }

    .result-item small {
      display: block;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .result-item strong {
      display: block;
      color: var(--blue-deep);
      font-size: clamp(23px, 6vw, 29px);
      line-height: 1.2;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    details {
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid #D9E8F0;
      border-radius: 11px;
      background: rgba(255,255,255,.88);
    }

    summary {
      padding: 12px 14px;
      cursor: pointer;
      color: #49616F;
      font-size: 13px;
      font-weight: 600;
      user-select: none;
    }

    .formula {
      padding: 0 14px 15px;
      color: #4C5D67;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .formula-title {
      margin-top: 8px;
      color: var(--blue-dark);
      font-weight: 700;
    }

    .formula-result {
      color: var(--blue-deep);
      font-weight: 700;
    }
    
/* =========================
   TEKS PENYEMANGAT
========================= */

.encouragement {
  margin: 20px 2px 5px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  text-align: center;
}

.encouragement-decoration {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 3px;
  color: #8d9690;
  line-height: 1;
}

.encouragement-decoration::before {
  content: "·";
  font-size: 12px;
  opacity: 1.1;
}

.encouragement-decoration::after {
  content: "•";
  font-size: 8px;
  opacity: 1.2;
}
    
/* Balik urutan supaya kanan tetap · • · */
.encouragement-decoration.right {
  flex-direction: row-reverse;
}

.encouragement-inner {
  min-width: 0;
  max-width: 570px;
  padding: 0;
}

.encouragement-text {
  display: block;
  color: #555a56;
  font-size: 13.5px;
  font-weight: 400;
  line-height: 1.65;
  opacity: 1;
  transition: opacity 0.8s ease;
  overflow-wrap: break-word;
  word-break: normal;
}

.encouragement-text.fade-out {
  opacity: 0;
}

.encouragement-text.fade-in {
  animation: encouragementIn 0.8s ease;
}

.encouragement-text.rtl {
  direction: rtl;
  font-family:
    "SF Arabic",
    "San Francisco Arabic",
    "Noto Sans Arabic",
    "Segoe UI",
    Arial,
    sans-serif;
}

.encouragement-text.ltr {
  direction: ltr;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    "Segoe UI",
    Arial,
    sans-serif;
}

.encouragement-emoji {
  display: inline;
  margin-inline-start: 4px;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI Emoji",
    "Apple Color Emoji",
    sans-serif;
  font-style: normal;
  font-weight: 500;
  white-space: nowrap;
}

@keyframes encouragementIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

    .history-section {
  margin-top: 8px;
  padding-top: 0;
  border-top: none;
}

    .history-heading {
      margin: 0 0 12px;
      color: var(--blue-dark);
      font-size: 17px;
      font-weight: 700;
      text-align: center;
    }

    .history details {
      margin-top: 0;
    }

    .history-wrap {
      overflow: auto;
      max-height: 280px;
      border-top: 1px solid var(--border);
    }

    table {
      width: 100%;
      min-width: 790px;
      border-collapse: separate;
      border-spacing: 0;
      background: #fff;
      font-size: 12px;
    }

    th, td {
      padding: 7px 6px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: #EAF4FA;
      color: #49616F;
      font-weight: 700;
    }

    td {
      color: #52616A;
      background: #fff;
    }

    tbody tr:nth-child(even) td { background: #F8FCFE; }

    th:first-child,
    td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      width: 112px;
      min-width: 112px;
      max-width: 112px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    th:first-child {
      z-index: 4;
      background: #EAF4FA;
    }

    tbody tr:nth-child(even) td:first-child { background: #F8FCFE; }

    th:nth-child(2), td:nth-child(2) { width: 58px; }
    th:nth-child(3), td:nth-child(3) {
      width: 145px;
      min-width: 145px;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5),
    th:nth-child(6), td:nth-child(6),
    th:nth-child(7), td:nth-child(7),
    th:nth-child(8), td:nth-child(8) {
      width: 54px;
      text-align: center;
    }
    th:nth-child(9), td:nth-child(9) { width: 38px; text-align: center; }

    .delete-btn {
      width: auto;
      min-width: 30px;
      min-height: 29px;
      margin: 0;
      padding: 3px 7px;
      border: 1px solid #D9E2E8;
      border-radius: 7px;
      background: #F5F9FB;
      color: #7A8993;
      cursor: pointer;
    }

    .delete-btn:hover {
      color: var(--error);
      background: #FFF4F3;
    }

    .empty {
      padding: 16px 8px;
      border-radius: 10px;
      background: #F8FCFE;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .clear-history {
      width: 100%;
      min-height: 43px;
      margin-top: 12px;
      padding: 10px 14px;
      border: 1px solid #D9E2E8;
      border-radius: 10px;
      background: #F8FBFD;
      color: #60727D;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background .18s ease;
    }

    .clear-history:hover {
      background: #EEF6FA;
    }

    .footer-note {
  margin: 10px 0 0;
  text-align: center;
  font-size: 11px;
  color: #8a8f8b;
    }

    .footer {
      flex: 0 0 auto;
      width: 100%;
      margin-top: auto;
      margin-left: 0;
      margin-right: 0;
      margin-bottom: 0;
      padding: 12px 20px 13px;
      text-align: center;
      background: var(--blue-dark);
      color: #fff;
      box-sizing: border-box;
    }

    .footer-copy {
      color: #fff;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .4px;
    }

    @media (max-width: 560px) {
      .container {
        width: 100%;
        padding: 22px 18px 32px;
      }

      .app-card {
        padding: 0;
      }

      .footer {
        width: 100%;
        margin: 0;
        border-radius: 0;
      }

      .result-box { grid-template-columns: 1fr; }

      .header { margin-bottom: 23px; }
      h1 { font-size: 23px; }
      .subtitle { font-size: 13px; }

      .encouragement-text {
        font-size: 13px;
        line-height: 1.75;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="app-card">

      <header class="header">
        <h1>Kalkulator Nilai Ujian Hifzh</h1>
        <p class="subtitle">Biar hitung-hitungan nggak ikut bikin pusing hihi..</p>
      </header>

      <section>
        <div class="field">
          <label for="nama">Nama Santriwati</label>
          <div class="clear-name-wrap">
            <input id="nama" type="text" autocomplete="name" placeholder="Masukkan nama santriwati">
            <button id="clearNameBtn" class="clear-name" type="button" aria-label="Hapus nama">×</button>
          </div>
          <div id="namaError" class="error-message hidden" aria-live="polite"></div>
        </div>

        <div class="field">
          <label for="jenis">Mau hitung ujian yang mana?</label>
          <select id="jenis">
            <option value="">Pilih jenis ujian</option>
            <option value="bulanan">Ujian Bulanan</option>
            <option value="semester">Ujian Semester</option>
          </select>
          <div id="jenisError" class="error-message hidden" aria-live="polite"></div>
        </div>
      </section>

      <section id="dynamicForm" class="form-area dynamic-form hidden"></section>

      <button id="hitungBtn" class="calculate-button" type="button" disabled>
        Hitung Nilainya
      </button>

      <section id="hasil" class="result hidden" aria-live="polite">
        <h2 class="result-title">Hasilnya nih 👇</h2>

        <div class="result-box">
          <div class="result-item">
            <small id="labelNilai">Nilai Ujian Per Juz</small>
            <strong id="nilai">-</strong>
          </div>

          <div id="bobotItem" class="result-item">
            <small>Bobot Nilai</small>
            <strong id="bobot">-</strong>
          </div>
        </div>

        <details>
          <summary>Mau cek hitungannya? 🔍</summary>
          <div id="rumus" class="formula"></div>
        </details>
      </section>

      <section class="encouragement" aria-live="polite" aria-label="Pesan penyemangat">
        <span class="encouragement-decoration left" aria-hidden="true"></span>
        <div class="encouragement-inner">
          <div id="encouragementText" class="encouragement-text"></div>
        </div>
        <span class="encouragement-decoration right" aria-hidden="true"></span>
      </section>

      <section class="history-section">
        <h2 class="history-heading">Riwayat</h2>

        <details id="historyDetails">
          <summary>Lihat Riwayat 🧾</summary>
          <div class="history-wrap">
            <div id="history" class="history"></div>
          </div>
          <p class="footer-note">Data riwayat tersimpan di perangkat ini.</p>
          <button id="hapusSemuaBtn" class="clear-history" type="button">
            Hapus Semua Riwayat
          </button>
        </details>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-copy">© 2026 ROMLAH</div>
  </footer>

  <script>
    "use strict";

    const STORAGE_KEY = "riwayatHifzh";
    const OLD_STORAGE_KEY = "riwayatHifzhBulanan";

    const state = {
      formVersion: 0,
      encouragementIndex: 0,
      encouragementTimer: null,
      validationAttempted: false
    };

    const encouragements = [
      { text: "ما أجمل تفانيك، وما أروع بذلك، شكر الله سعيك", emoji: "🍄", direction: "rtl" },
      { text: "جزاك الله الدرجات العلى من الجنة", emoji: "🌷", direction: "rtl" },
      { text: "Terima kasih sudah menjadi bagian dari proses belajar mereka", emoji: "💝", direction: "ltr" },
      { text: "Satu per satu, insyaallah selesai juga", emoji: "🪻", direction: "ltr" },
      { text: "سقى الله قلبك غيثا من السعادة", emoji: "🎈", direction: "rtl" },
      { text: "Semoga dimudahkan dalam setiap penilaian", emoji: "💐", direction: "ltr" },
      { text: "Semoga setiap lelah menjadi pahala di sisi Allah", emoji: "🤲", direction: "ltr" },
      { text: "Pelan-pelan, yang penting teliti dan tetap semangat", emoji: "🌿", direction: "ltr" },
      { text: "Semoga ini menjadi amal jariyah sampai anak² dewasa, aamiin", emoji: "🌱", direction: "ltr" },
      { text: "كتب الله أجرك وبارك في عملك", emoji: "🌸", direction: "rtl" }
    ];

    const els = {
      nama: document.getElementById("nama"),
      namaError: document.getElementById("namaError"),
      jenis: document.getElementById("jenis"),
      jenisError: document.getElementById("jenisError"),
      dynamicForm: document.getElementById("dynamicForm"),
      hitungBtn: document.getElementById("hitungBtn"),
      hasil: document.getElementById("hasil"),
      labelNilai: document.getElementById("labelNilai"),
      nilai: document.getElementById("nilai"),
      bobotItem: document.getElementById("bobotItem"),
      bobot: document.getElementById("bobot"),
      rumus: document.getElementById("rumus"),
      history: document.getElementById("history"),
      hapusSemuaBtn: document.getElementById("hapusSemuaBtn"),
      encouragementText: document.getElementById("encouragementText"),
      clearNameBtn: document.getElementById("clearNameBtn")
    };

    function fmt(value) {
      return Number(value).toLocaleString("id-ID", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function angka(value) {
      return Number(value).toLocaleString("id-ID", {
        maximumFractionDigits: 10
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getElementValue(id) {
      const element = document.getElementById(id);
      return element ? element.value.trim() : "";
    }

    function getNumber(id) {
      const value = getElementValue(id);
      return value === "" ? NaN : Number(value);
    }

    function setError(id, message) {
      const input = document.getElementById(id);
      const error = document.getElementById(id + "Error");

      if (input) {
        input.classList.add("input-error");
        input.setAttribute("aria-invalid", "true");
      }

      if (error) {
        error.textContent = message;
        error.classList.remove("hidden");
      }
    }

    function clearError(id) {
      const input = document.getElementById(id);
      const error = document.getElementById(id + "Error");

      if (input) {
        input.classList.remove("input-error");
        input.removeAttribute("aria-invalid");
      }

      if (error) {
        error.textContent = "";
        error.classList.add("hidden");
      }
    }

    function clearAllErrors() {
      document.querySelectorAll(".input-error").forEach(el => {
        el.classList.remove("input-error");
        el.removeAttribute("aria-invalid");
      });

      document.querySelectorAll(".error-message").forEach(el => {
        el.textContent = "";
        el.classList.add("hidden");
      });
    }

    function fieldHtml({
      id,
      label,
      type = "number",
      min = "",
      max = "",
      step = "1",
      placeholder = "",
      note = ""
    }) {
      const minAttr = min !== "" ? ` min="${min}"` : "";
      const maxAttr = max !== "" ? ` max="${max}"` : "";
      const stepAttr = step !== "" ? ` step="${step}"` : "";

      return `
        <div class="field">
          <label for="${id}">${label}</label>
          <input
            id="${id}"
            type="${type}"
            ${minAttr}
            ${maxAttr}
            ${stepAttr}
            placeholder="${placeholder}"
            ${type === "number" ? 'inputmode="decimal"' : ""}
          >
          <div id="${id}Error" class="error-message hidden" aria-live="polite"></div>
          ${note ? `<div class="note">${note}</div>` : ""}
        </div>
      `;
    }

    function selectHtml({ id, label, options }) {
      return `
        <div class="field">
          <label for="${id}">${label}</label>
          <select id="${id}">
            <option value="">Pilih...</option>
            ${options.map(option => `
              <option value="${option.value}">${option.label}</option>
            `).join("")}
          </select>
          <div id="${id}Error" class="error-message hidden" aria-live="polite"></div>
        </div>
      `;
    }

    function resetResult() {
      els.hasil.classList.add("hidden");
      els.nilai.textContent = "-";

      els.rumus.innerHTML = "";

    function updateCalculateButton() {

        els.nama.value.trim() !== "" ||
        els.jenis.value !== "" ||

      els.labelNilai.textContent = labelNilai;
      els.nilai.textContent = fmt(nilai);

      const adaBobot = Number.isFinite(bobot);

      els.bobotItem.classList.toggle("hidden", !adaBobot);
      els.bobot.textContent = adaBobot ? fmt(bobot) : "-";

      els.hasil.classList.remove("hidden");

    function validateAll() {
      clearAllErrors();

      let valid = true;
      let firstInvalid = null;

      const fail = (id, message) => {
        setError(id, message);
        valid = false;
        if (!firstInvalid) firstInvalid = document.getElementById(id);
      };

      const nama = els.nama.value.trim();
      const jenis = els.jenis.value;

      if (!nama) fail("nama", "Namanya belum diisi nih.");
      if (!jenis) fail("jenis", "Mau hitung ujian yang mana dulu?");

      if (!jenis) return { valid, firstInvalid };

      if (jenis === "bulanan") {
        const materi = getElementValue("materiBulanan");
        if (!materi) {
          fail("materiBulanan", "Materinya belum dipilih.");
        } else {
          const kesalahanRaw = getElementValue("kesalahan");
          const kesalahan = getNumber("kesalahan");

          if (kesalahanRaw === "") {
            fail("kesalahan", "Jumlah kesalahan nggak bisa kosong.");
          } else if (!Number.isFinite(kesalahan) || kesalahan < 0) {
            fail("kesalahan", "Jumlah kesalahannya nggak bisa kurang dari 0.");
          }

          if (materi === "30") {
            const halamanRaw = getElementValue("halaman");
            const halaman = getNumber("halaman");
            if (halamanRaw === "") {
              fail("halaman", "Jumlah halamannya belum diisi.");
            } else if (!Number.isFinite(halaman) || halaman <= 0) {
              fail("halaman", "Jumlah halaman harus lebih dari 0.");
            }
          } else {
            const juzRaw = getElementValue("jumlahJuz");
            const jumlahJuz = getNumber("jumlahJuz");
            if (juzRaw === "") {
              fail("jumlahJuz", "Jumlah juznya belum diisi.");
            } else if (!Number.isInteger(jumlahJuz) || jumlahJuz < 1 || jumlahJuz > 5) {
              fail("jumlahJuz", "Jumlah juznya pilih antara 1–5.");
            }
          }
        }
      }

      if (jenis === "semester") {
        const kondisi = getElementValue("semesterGenap");

        if (!kondisi) {
          fail("semesterGenap", "Materinya sudah genap 1 juz atau belum?");
        } else {
          const kesalahanRaw = getElementValue("kesalahan");
          const kesalahan = getNumber("kesalahan");

          if (kesalahanRaw === "") {
            fail("kesalahan", "Jumlah kesalahan nggak bisa kosong.");
          } else if (!Number.isFinite(kesalahan) || kesalahan < 0) {
            fail("kesalahan", "Jumlah kesalahannya nggak bisa kurang dari 0.");
          }

          if (kondisi === "belum") {
            const materi = getElementValue("materiSemester");

            if (!materi) {
              fail("materiSemester", "Materinya belum dipilih.");
            } else {
              const halamanRaw = getElementValue("halaman");
              const halaman = getNumber("halaman");

              if (halamanRaw === "") {
                fail("halaman", "Jumlah halamannya belum diisi.");
              } else if (!Number.isFinite(halaman) || halaman <= 0) {
                fail("halaman", "Jumlah halaman harus lebih dari 0.");
              }
            }
          }
        }
      }

      return { valid, firstInvalid };
    }

    function attachLiveValidation() {
      els.dynamicForm.querySelectorAll("input, select").forEach(el => {
        el.addEventListener("input", () => {
          updateCalculateButton();
          if (state.validationAttempted) validateAll();
        });

        el.addEventListener("change", () => {
          updateCalculateButton();
          if (state.validationAttempted) validateAll();
        });
      });
    }

    function hitungBulanan() {
      const materi = getElementValue("materiBulanan");
      const nama = els.nama.value.trim();
      const kesalahan = getNumber("kesalahan");

      let nilai, bobot, halaman = null, jumlahJuz = null, rumus = "";

      if (materi === "30") {
        halaman = getNumber("halaman");
        const totalHalaman = 23;

        nilai = 100 - ((kesalahan * 2 * totalHalaman) / halaman);
        bobot = nilai * (halaman / totalHalaman);

        rumus = `
          <div class="formula-title">Nilai Ujian Per Juz</div>
          <div>= 100 - ((${angka(kesalahan)} × 2 × 23) ÷ ${angka(halaman)})</div>
          <div>= 100 - (${angka(kesalahan * 2 * totalHalaman)} ÷ ${angka(halaman)})</div>
          <div class="formula-result">= ${fmt(nilai)}</div>

          <div class="formula-title">Bobot Nilai</div>
          <div>= ${fmt(nilai)} × (${angka(halaman)} ÷ 23)</div>
          <div class="formula-result">= ${fmt(bobot)}</div>
        `;
      } else {
        jumlahJuz = getNumber("jumlahJuz");

        nilai = 100 - kesalahan * 2;
        bobot = nilai * jumlahJuz;

        rumus = `
          <div class="formula-title">Nilai Ujian Bulanan</div>
          <div>= 100 - (${angka(kesalahan)} × 2)</div>
          <div class="formula-result">= ${fmt(nilai)}</div>

          <div class="formula-title">Bobot Nilai</div>
          <div>= ${fmt(nilai)} × ${angka(jumlahJuz)}</div>
          <div class="formula-result">= ${fmt(bobot)}</div>
        `;
      }

      tampilkanHasil({
        labelNilai: materi === "30" ? "Nilai Ujian Per Juz" : "Nilai Ujian Bulanan",
        nilai,
        bobot,
        rumus
      });

      simpanRiwayat({
        id: createId(),
        waktu: new Date().toLocaleString("id-ID"),
        nama,
        ujian: "Ujian Bulanan",
        materi: materi === "30" ? "Juz 30 (Belum Genap)" : "1 Juz atau Lebih",
        kesalahan,
        halaman,
        jumlahJuz,
        nilai,
        bobot
      });
    }

    function hitungSemester() {
      const kondisi = getElementValue("semesterGenap");
      const nama = els.nama.value.trim();
      const kesalahan = getNumber("kesalahan");

      let nilai;
      let halaman = null;
      let materiRiwayat;
      let rumus = "";

      if (kondisi === "genap") {
        nilai = 100 - kesalahan * 2;
        materiRiwayat = "Genap 1 Juz";

        rumus = `
          <div class="formula-title">Nilai Ujian Per Juz</div>
          <div>= 100 - (${angka(kesalahan)} × 2)</div>
          <div class="formula-result">= ${fmt(nilai)}</div>
        `;
      } else {
        const materi = getElementValue("materiSemester");
        halaman = getNumber("halaman");

        if (materi === "30") {
          const totalHalaman = 23;
          nilai = 100 - ((kesalahan * 2 * totalHalaman) / halaman);
          materiRiwayat = "Belum Genap 1 Juz — Juz 30";

          rumus = `
            <div class="formula-title">Nilai Ujian Per Juz</div>
            <div>= 100 - ((${angka(kesalahan)} × 2 × 23) ÷ ${angka(halaman)})</div>
            <div>= 100 - (${angka(kesalahan * 2 * totalHalaman)} ÷ ${angka(halaman)})</div>
            <div class="formula-result">= ${fmt(nilai)}</div>
          `;
        } else {
          const totalHalaman = 20;
          nilai = 100 - ((kesalahan * 2 * totalHalaman) / halaman);
          materiRiwayat = "Belum Genap 1 Juz — Selain Juz 30";

          rumus = `
            <div class="formula-title">Nilai Ujian Per Juz</div>
            <div>= 100 - ((${angka(kesalahan)} × 2 × 20) ÷ ${angka(halaman)})</div>
            <div>= 100 - (${angka(kesalahan * 2 * totalHalaman)} ÷ ${angka(halaman)})</div>
            <div class="formula-result">= ${fmt(nilai)}</div>
          `;
        }
      }

      tampilkanHasil({
        labelNilai: "Nilai Ujian Per Juz",
        nilai,
        bobot: null,
        rumus
      });

      simpanRiwayat({
        id: createId(),
        waktu: new Date().toLocaleString("id-ID"),
        nama,
        ujian: "Ujian Semester",
        materi: materiRiwayat,
        kesalahan,
        halaman,
        jumlahJuz: null,
        nilai,
        bobot: null
      });
    }

    function hitung() {
      state.validationAttempted = true;

      const validation = validateAll();

      if (!validation.valid) {
        resetResult();

        if (validation.firstInvalid) {
          requestAnimationFrame(() => {
            validation.firstInvalid.scrollIntoView({
              behavior: "smooth",
              block: "center"
            });
            validation.firstInvalid.focus({ preventScroll: true });
          });
        }
        return;
      }

      if (els.jenis.value === "bulanan") {
        hitungBulanan();
      } else if (els.jenis.value === "semester") {
        hitungSemester();
      }
    }

    function createId() {
      return Date.now() + "-" + Math.random().toString(36).slice(2, 9);
    }

    function ambilRiwayat() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function simpanRiwayat(data) {
      const riwayat = ambilRiwayat();
      riwayat.unshift(data);

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(riwayat.slice(0, 200))
      );

      tampilkanRiwayat();
    }

    function migrasiRiwayatLama() {
      if (localStorage.getItem(STORAGE_KEY)) return;

      try {
        const oldData = JSON.parse(localStorage.getItem(OLD_STORAGE_KEY));

        if (!Array.isArray(oldData) || oldData.length === 0) return;

        const migrated = oldData.map(item => ({
          id: item.id || createId(),
          waktu: item.waktu || "-",
          nama: item.nama || "-",
          ujian: "Ujian Bulanan",
          materi: item.jenis || "-",
          kesalahan: Number(item.kesalahan) || 0,
          halaman: item.halaman ?? null,
          jumlahJuz: item.jumlahJuz ?? null,
          nilai: Number(item.nilai) || 0,
          bobot: item.bobot === null || item.bobot === undefined || item.bobot === ""
            ? null
            : Number(item.bobot)
        }));

        localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
      } catch {}
    }

    function tampilkanRiwayat() {
      const riwayat = ambilRiwayat();

      if (!riwayat.length) {
        els.history.innerHTML = `
          <div class="empty">
            Belum ada riwayat.<br>
            Hasil perhitungan nanti akan muncul di sini.
          </div>
        `;
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Ujian</th>
              <th>Materi</th>
              <th>Kesalahan</th>
              <th>Hlm</th>
              <th>Juz</th>
              <th>Nilai</th>
              <th>Bobot</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
      `;

      for (const item of riwayat) {
        const bobotText =
          item.bobot === null || item.bobot === undefined || item.bobot === ""
            ? "-"
            : fmt(item.bobot);

        const ujianSingkat =
          item.ujian === "Ujian Bulanan"
            ? "Bulanan"
            : item.ujian === "Ujian Semester"
              ? "Semester"
              : (item.ujian || "-");

        let materi = item.materi || "-";
        materi = materi
          .replace("Belum Genap 1 Juz — Juz 30", "Belum Genap 1 Juz")
          .replace("Belum Genap 1 Juz — Selain Juz 30", "Selain Juz 30");

        html += `
          <tr>
            <td>${escapeHtml(item.nama)}</td>
            <td>${escapeHtml(ujianSingkat)}</td>
            <td>${escapeHtml(materi)}</td>
            <td>${angka(item.kesalahan ?? 0)}</td>
            <td>${item.halaman !== null && item.halaman !== undefined ? angka(item.halaman) : "-"}</td>
            <td>${item.jumlahJuz !== null && item.jumlahJuz !== undefined ? angka(item.jumlahJuz) : "-"}</td>
            <td>${fmt(item.nilai)}</td>
            <td>${bobotText}</td>
            <td>
              <button
                class="delete-btn"
                type="button"
                data-delete-id="${escapeHtml(item.id)}"
                aria-label="Hapus riwayat"
                title="Hapus"
              >×</button>
            </td>
          </tr>
        `;
      }

      html += "</tbody></table>";
      els.history.innerHTML = html;
    }

    function hapusRiwayat(id) {
      const riwayat = ambilRiwayat().filter(
        item => String(item.id) !== String(id)
      );

      localStorage.setItem(STORAGE_KEY, JSON.stringify(riwayat));
      tampilkanRiwayat();
    }

    function hapusSemuaRiwayat() {
      const riwayat = ambilRiwayat();
      if (!riwayat.length) return;

      if (confirm("Hapus semua riwayat perhitungan?")) {
        localStorage.removeItem(STORAGE_KEY);
        tampilkanRiwayat();
      }
    }

    function setEncouragementContent(item) {
      els.encouragementText.className =
        `encouragement-text ${item.direction}`;

      els.encouragementText.innerHTML = `
        <span class="encouragement-message">
          ${escapeHtml(item.text)}
          <span class="encouragement-emoji" aria-hidden="true">${item.emoji}</span>
        </span>
      `;
    }

    function renderEncouragement(index, animate = false) {
      const item = encouragements[index];
      const target = els.encouragementText;

      if (!animate) {
        setEncouragementContent(item);
        return;
      }

      target.classList.remove("fade-in");
      target.classList.add("fade-out");

      window.setTimeout(() => {
        setEncouragementContent(item);
        target.classList.remove("fade-out");
        target.classList.add("fade-in");
      }, 800);
    }

    function mulaiPesanPenyemangat() {
      if (state.encouragementTimer) {
        clearInterval(state.encouragementTimer);
      }

      state.encouragementIndex = 0;
      renderEncouragement(0, false);

      state.encouragementTimer = window.setInterval(() => {
        state.encouragementIndex =
          (state.encouragementIndex + 1) % encouragements.length;

        renderEncouragement(state.encouragementIndex, true);
      }, 11600);
    }

    function clearErrorAsUserEdits(id) {
      if (!state.validationAttempted) return;
      const value = getElementValue(id);

      if (id === "nama" && value) clearError(id);
      if (id === "jenis" && value) clearError(id);

      if (id === "kesalahan") {
        const n = getNumber(id);
        if (value !== "" && Number.isFinite(n) && n >= 0) clearError(id);
      }

      if (id === "halaman") {
        const n = getNumber(id);
        if (value !== "" && Number.isFinite(n) && n > 0) clearError(id);
      }

      if (id === "jumlahJuz") {
        const n = getNumber(id);
        if (value !== "" && Number.isInteger(n) && n >= 1 && n <= 5) clearError(id);
      }

      if (id === "materiBulanan" && value) clearError(id);
      if (id === "materiSemester" && value) clearError(id);
      if (id === "semesterGenap" && value) clearError(id);
    }

    els.nama.addEventListener("input", () => {
      updateCalculateButton();
      clearErrorAsUserEdits("nama");
    });

    els.jenis.addEventListener("change", () => {
      renderForm();
      updateCalculateButton();
    });

    els.clearNameBtn.addEventListener("click", () => {
      els.nama.value = "";
      els.nama.focus();
      updateCalculateButton();

      if (state.validationAttempted) {
        setError("nama", "Namanya belum diisi nih.");
      }
    });

    els.hitungBtn.addEventListener("click", hitung);

    els.hapusSemuaBtn.addEventListener("click", hapusSemuaRiwayat);

    els.history.addEventListener("click", event => {
      const button = event.target.closest("[data-delete-id]");
      if (!button) return;
      hapusRiwayat(button.dataset.deleteId);
    });

    els.nama.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        els.jenis.focus();
      }
    });

    document.addEventListener("input", event => {
      if (event.target.matches("#dynamicForm input, #dynamicForm select")) {
        updateCalculateButton();
        clearErrorAsUserEdits(event.target.id);
      }
    });

    document.addEventListener("change", event => {
      if (event.target.matches("#dynamicForm input, #dynamicForm select")) {
        updateCalculateButton();
        clearErrorAsUserEdits(event.target.id);
      }
    });

    migrasiRiwayatLama();
    tampilkanRiwayat();
    mulaiPesanPenyemangat();
    updateCalculateButton();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(error => {
          console.error("Service Worker gagal didaftarkan:", error);
        });
      });
    }
  </script>
</body>
</html>
